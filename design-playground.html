<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Exact Date – Design Playground</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Roboto", "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar (Controls) ───────────────────────────────── */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 18px 18px 10px;
      border-bottom: 1px solid #2a2a2a;
    }

    .section {
      padding: 14px 18px;
      border-bottom: 1px solid #222;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .row label {
      font-size: 13px;
      color: #ccc;
      flex: 1;
      white-space: nowrap;
    }

    .row input[type="color"] {
      width: 36px;
      height: 28px;
      border: 1px solid #444;
      border-radius: 5px;
      background: none;
      cursor: pointer;
      padding: 1px;
    }

    .row input[type="range"] {
      flex: 1;
      accent-color: #ff0000;
      cursor: pointer;
    }

    .row input[type="number"] {
      width: 60px;
      background: #252525;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      color: #f1f1f1;
      font-size: 13px;
      padding: 4px 7px;
      text-align: right;
    }

    .row input[type="number"]:focus,
    .row input[type="range"]:focus { outline: none; }

    .row select {
      background: #252525;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      color: #f1f1f1;
      font-size: 13px;
      padding: 4px 8px;
      cursor: pointer;
      flex: 1;
    }

    .row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff0000;
      cursor: pointer;
    }

    .val-label {
      font-size: 12px;
      color: #888;
      min-width: 30px;
      text-align: right;
    }

    /* CSS Output */
    #css-output {
      margin: 0 18px 14px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: "Consolas", monospace;
      font-size: 11px;
      color: #8bc34a;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      cursor: pointer;
      user-select: all;
    }

    #css-output:hover { border-color: #555; }

    #copy-btn {
      margin: 0 18px 14px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      width: calc(100% - 36px);
      transition: background .15s;
    }
    #copy-btn:hover { background: #cc0000; }
    #copy-btn.copied { background: #2e7d32; }

    /* ── Preview Area ─────────────────────────────────────── */
    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      background: #0f0f0f;
    }

    #preview h2 {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 20px;
    }

    /* ── Simulated YouTube Cards ─────────────────────────── */
    .yt-section-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin: 28px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e1e1e;
    }

    /* Grid (Startseite) */
    .yt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }

    .yt-card {
      cursor: default;
    }

    .yt-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #272727;
      border-radius: 10px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .yt-thumb-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1f1f1f 0%, #2d2d2d 50%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a3a3a;
      font-size: 28px;
    }

    .yt-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,.85);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .yt-card-info {
      display: flex;
      gap: 10px;
    }

    .yt-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .yt-meta { flex: 1; }

    .yt-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: #f1f1f1;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .yt-channel {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 2px;
    }

    .metadata-line {
      font-size: 12px;
      color: #aaa;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
    }

    .inline-metadata-item {
      display: inline-block;
    }

    /* List (Suche) */
    .yt-list { display: flex; flex-direction: column; gap: 10px; }

    .yt-list-card {
      display: flex;
      gap: 14px;
    }

    .yt-list-thumb {
      width: 200px;
      min-width: 200px;
      aspect-ratio: 16/9;
      background: #272727;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .yt-list-thumb-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1f1f1f, #2d2d2d, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a3a3a;
      font-size: 22px;
    }

    .yt-list-meta .yt-title { font-size: 16px; }

    /* Compact (Sidebar) */
    .yt-compact { display: flex; flex-direction: column; gap: 8px; }

    .yt-compact-card {
      display: flex;
      gap: 8px;
    }

    .yt-compact-thumb {
      width: 130px;
      min-width: 130px;
      aspect-ratio: 16/9;
      background: #272727;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    .yt-compact-thumb-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1f1f1f, #2d2d2d);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a3a3a;
      font-size: 16px;
    }

    .yt-compact-meta .yt-title { font-size: 13px; }
    .yt-compact-meta .yt-channel { font-size: 11px; }
    .yt-compact-meta .metadata-line { font-size: 11px; }

    /* ── Badge (injected by JS) ──────────────────────────── */
    .xdate-badge {
      display: inline-flex;
      align-items: center;
      gap: 0px;
      margin-left: 1px;
      padding: 0px 5px;
      border-radius: 8px;
      font-weight: 300;
      font-size: 0.85rem;
      line-height: 1.35;
      white-space: nowrap;
      color: #43c463;
      background: rgba(67,196,99,0.00);
      border: 0.5px solid rgba(67,196,99,0.35);
    }
    .xdate-badge.xdate-wait {
      color: #9aa0a6;
      background: rgba(154,160,166,.14);
      border-color: rgba(154,160,166,.30);
      font-weight: 400;
    }
    .xdate-badge.xdate-err {
      color: #e0a030;
      background: rgba(224,160,48,.14);
      border-color: rgba(224,160,48,.30);
    }
  </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════════════════════════════════ -->
<aside id="sidebar">
  <h1>Badge Design</h1>

  <!-- Farbe -->
  <div class="section">
    <div class="section-title">Farbe</div>

    <div class="row">
      <label>Text-Farbe</label>
      <input type="color" id="c-color" value="#43c463">
    </div>
    <div class="row">
      <label>Hintergrund-Opacity</label>
      <input type="range" id="c-bg-alpha" min="0" max="40" value="0">
      <span class="val-label" id="c-bg-alpha-val">0%</span>
    </div>
    <div class="row">
      <label>Border-Opacity</label>
      <input type="range" id="c-border-alpha" min="0" max="100" value="35">
      <span class="val-label" id="c-border-alpha-val">35%</span>
    </div>
  </div>

  <!-- Schrift -->
  <div class="section">
    <div class="section-title">Schrift</div>

    <div class="row">
      <label>Größe (rem)</label>
      <input type="range" id="c-fontsize" min="0.7" max="2.0" step="0.05" value="0.85">
      <span class="val-label" id="c-fontsize-val">0.85</span>
    </div>
    <div class="row">
      <label>Gewicht</label>
      <select id="c-fontweight">
        <option value="300" selected>Light</option>
        <option value="400">Normal</option>
        <option value="500">Medium</option>
        <option value="600">SemiBold</option>
        <option value="700">Bold</option>
      </select>
    </div>
    <div class="row">
      <label>Zeilenhöhe</label>
      <input type="range" id="c-lineheight" min="1.0" max="2.5" step="0.05" value="1.35">
      <span class="val-label" id="c-lineheight-val">1.35</span>
    </div>
  </div>

  <!-- Abstand & Form -->
  <div class="section">
    <div class="section-title">Abstand & Form</div>

    <div class="row">
      <label>Padding X (px)</label>
      <input type="range" id="c-px" min="0" max="20" value="5">
      <span class="val-label" id="c-px-val">5px</span>
    </div>
    <div class="row">
      <label>Padding Y (px)</label>
      <input type="range" id="c-py" min="0" max="12" value="0">
      <span class="val-label" id="c-py-val">0px</span>
    </div>
    <div class="row">
      <label>Border-Radius (px)</label>
      <input type="range" id="c-radius" min="0" max="20" value="8">
      <span class="val-label" id="c-radius-val">8px</span>
    </div>
    <div class="row">
      <label>Margin Left (px)</label>
      <input type="range" id="c-ml" min="0" max="20" value="1">
      <span class="val-label" id="c-ml-val">1px</span>
    </div>
    <div class="row">
      <label>Gap Icon↔Text (px)</label>
      <input type="range" id="c-gap" min="0" max="10" value="0">
      <span class="val-label" id="c-gap-val">0px</span>
    </div>
    <div class="row">
      <label>Border Breite (px)</label>
      <input type="range" id="c-bw" min="0" max="4" step="0.5" value="0.5">
      <span class="val-label" id="c-bw-val">0.5px</span>
    </div>
  </div>

  <!-- Inhalt -->
  <div class="section">
    <div class="section-title">Inhalt</div>

    <div class="row">
      <label>Emoji/Präfix</label>
      <select id="c-emoji">
        <option value="📅">📅 Kalender</option>
        <option value="🗓️">🗓️ Spiralbuch</option>
        <option value="⏰">⏰ Wecker</option>
        <option value="🕐">🕐 Uhr</option>
        <option value="">(keins)</option>
      </select>
    </div>
    <div class="row">
      <label>Datum-Format</label>
      <select id="c-format">
        <option value="DD.MM.YYYY" selected>DD.MM.YYYY</option>
        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
        <option value="MM/DD/YYYY">MM/DD/YYYY</option>
        <option value="D. Mon YYYY">D. Mon YYYY</option>
      </select>
    </div>
    <div class="row">
      <label>Uhrzeit zeigen</label>
      <input type="checkbox" id="c-time">
    </div>
    <div class="row">
      <label>Modus</label>
      <select id="c-mode">
        <option value="append" selected>append (neben alt)</option>
        <option value="replace">replace (nur exakt)</option>
      </select>
    </div>
  </div>

  <!-- CSS Output -->
  <div class="section">
    <div class="section-title">CSS kopieren → content.js</div>
    <code id="css-output"></code>
    <button id="copy-btn">CSS kopieren</button>
  </div>
</aside>

<!-- ═══════════════ PREVIEW ═══════════════════════════════════════════ -->
<main id="preview">
  <h2>Vorschau – YouTube Videokarten</h2>

  <!-- Grid (Startseite) -->
  <div class="yt-section-label">Startseite / Kanal-Grid</div>
  <div class="yt-grid" id="grid-cards"></div>

  <!-- Search (Suche) -->
  <div class="yt-section-label">Suchergebnisse</div>
  <div class="yt-list" id="list-cards"></div>

  <!-- Compact (Sidebar) -->
  <div class="yt-section-label">Sidebar (neben Video)</div>
  <div class="yt-compact" id="compact-cards"></div>
</main>

<script>
/* ═══════════════ Dummy-Daten ══════════════════════════════════════════ */
const VIDEOS = [
  { title: "I built an AI that codes better than me", channel: "Fireship", views: "1,4 Mio.", ago: "vor 8 Monaten", date: "2025-09-15T14:22:00", dur: "9:47", icon: "🔥" },
  { title: "CSS Grid in 20 minutes – Full Tutorial", channel: "Kevin Powell", views: "890 Tsd.", ago: "vor 1 Jahr", date: "2024-11-03T09:00:00", dur: "20:14", icon: "🎨" },
  { title: "Why I switched from VS Code to Neovim", channel: "ThePrimeagen", views: "2,1 Mio.", ago: "vor 2 Jahren", date: "2023-06-27T18:30:00", dur: "15:02", icon: "⌨️" },
  { title: "The most misunderstood concept in JavaScript", channel: "Computerphile", views: "3,8 Mio.", ago: "vor 3 Jahren", date: "2022-03-11T12:00:00", dur: "23:59", icon: "📐" },
  { title: "Building a browser extension in 30 minutes", channel: "Dev Ed", views: "412 Tsd.", ago: "vor 5 Monaten", date: "2025-12-01T10:15:00", dur: "30:05", icon: "🧩" },
  { title: "Linux is actually good now (ft. my desktop)", channel: "Chris Titus Tech", views: "678 Tsd.", ago: "vor 11 Monaten", date: "2025-06-20T08:45:00", dur: "18:33", icon: "🐧" },
];

/* ═══════════════ Datum formatieren ══════════════════════════════════ */
function formatDate(iso, fmt, showTime, emoji) {
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  const months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

  let s;
  if (fmt === "YYYY-MM-DD")      s = `${yyyy}-${mm}-${dd}`;
  else if (fmt === "MM/DD/YYYY") s = `${mm}/${dd}/${yyyy}`;
  else if (fmt === "D. Mon YYYY") s = `${d.getDate()}. ${months[d.getMonth()]} ${yyyy}`;
  else                            s = `${dd}.${mm}.${yyyy}`;

  if (showTime) {
    const hh = String(d.getHours()).padStart(2, "0");
    const mi = String(d.getMinutes()).padStart(2, "0");
    s += ` ${hh}:${mi}`;
  }

  return (emoji ? emoji + " " : "") + s;
}

/* ═══════════════ Einstellungen lesen ════════════════════════════════ */
function getSettings() {
  return {
    color:       document.getElementById("c-color").value,
    bgAlpha:     parseInt(document.getElementById("c-bg-alpha").value),
    borderAlpha: parseInt(document.getElementById("c-border-alpha").value),
    fontSize:    parseFloat(document.getElementById("c-fontsize").value),
    fontWeight:  document.getElementById("c-fontweight").value,
    lineHeight:  parseFloat(document.getElementById("c-lineheight").value),
    px:          parseInt(document.getElementById("c-px").value),
    py:          parseInt(document.getElementById("c-py").value),
    radius:      parseInt(document.getElementById("c-radius").value),
    ml:          parseInt(document.getElementById("c-ml").value),
    gap:         parseInt(document.getElementById("c-gap").value),
    bw:          parseFloat(document.getElementById("c-bw").value),
    emoji:       document.getElementById("c-emoji").value,
    format:      document.getElementById("c-format").value,
    showTime:    document.getElementById("c-time").checked,
    mode:        document.getElementById("c-mode").value,
  };
}

/* ═══════════════ Hex → RGB ══════════════════════════════════════════ */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

/* ═══════════════ Badge-Styles berechnen ═════════════════════════════ */
function badgeCSS(s) {
  const rgb = hexToRgb(s.color);
  const bgA = (s.bgAlpha / 100).toFixed(2);
  const bdA = (s.borderAlpha / 100).toFixed(2);
  return {
    display: "inline-flex",
    alignItems: "center",
    gap: s.gap + "px",
    marginLeft: s.ml + "px",
    padding: `${s.py}px ${s.px}px`,
    borderRadius: s.radius + "px",
    fontWeight: s.fontWeight,
    fontSize: s.fontSize + "rem",
    lineHeight: s.lineHeight,
    whiteSpace: "nowrap",
    color: s.color,
    background: `rgba(${rgb},${bgA})`,
    border: `${s.bw}px solid rgba(${rgb},${bdA})`,
  };
}

/* ═══════════════ Badges updaten ══════════════════════════════════════ */
function updateBadges() {
  const s = getSettings();
  const css = badgeCSS(s);

  document.querySelectorAll(".xdate-badge:not(.xdate-wait):not(.xdate-err)").forEach(badge => {
    const vid = badge.dataset.vid;
    const v = VIDEOS.find(x => x.title === vid) || VIDEOS[0];
    badge.textContent = formatDate(v.date, s.format, s.showTime, s.emoji);
    Object.assign(badge.style, css);
  });

  // Modus: relative Zeit ein/ausblenden
  document.querySelectorAll(".inline-metadata-item.ago-item").forEach(el => {
    el.style.display = s.mode === "replace" ? "none" : "";
  });

  updateCSSOutput(s);
}

/* ═══════════════ CSS Output ══════════════════════════════════════════ */
function updateCSSOutput(s) {
  const rgb = hexToRgb(s.color);
  const bgA = (s.bgAlpha / 100).toFixed(2);
  const bdA = (s.borderAlpha / 100).toFixed(2);
  document.getElementById("css-output").textContent =
`.xdate-badge {
  display: inline-flex;
  align-items: center;
  gap: ${s.gap}px;
  margin-left: ${s.ml}px;
  padding: ${s.py}px ${s.px}px;
  border-radius: ${s.radius}px;
  font-weight: ${s.fontWeight};
  font-size: ${s.fontSize}rem;
  line-height: ${s.lineHeight};
  white-space: nowrap;
  color: ${s.color};
  background: rgba(${rgb},${bgA});
  border: ${s.bw}px solid rgba(${rgb},${bdA});
}`;
}

/* ═══════════════ Karten aufbauen ════════════════════════════════════ */
function buildCards() {
  const s = getSettings();
  const css = badgeCSS(s);

  // Grid
  const grid = document.getElementById("grid-cards");
  grid.innerHTML = "";
  VIDEOS.forEach(v => {
    const el = document.createElement("div");
    el.className = "yt-card";
    el.innerHTML = `
      <div class="yt-thumb">
        <div class="yt-thumb-inner">${v.icon}</div>
        <span class="yt-duration">${v.dur}</span>
      </div>
      <div class="yt-card-info">
        <div class="yt-avatar">${v.channel[0]}</div>
        <div class="yt-meta">
          <div class="yt-title">${v.title}</div>
          <div class="yt-channel">${v.channel}</div>
          <div class="metadata-line">
            <span class="inline-metadata-item">${v.views} Aufrufe</span>
            <span class="inline-metadata-item">&nbsp;•&nbsp;</span>
            <span class="inline-metadata-item ago-item">${v.ago}</span>
          </div>
        </div>
      </div>`;
    grid.appendChild(el);

    const badge = document.createElement("span");
    badge.className = "xdate-badge";
    badge.dataset.vid = v.title;
    badge.textContent = formatDate(v.date, s.format, s.showTime, s.emoji);
    Object.assign(badge.style, css);
    el.querySelector(".metadata-line").appendChild(badge);

    if (s.mode === "replace")
      el.querySelector(".ago-item").style.display = "none";
  });

  // List (nur erste 3)
  const list = document.getElementById("list-cards");
  list.innerHTML = "";
  VIDEOS.slice(0, 3).forEach(v => {
    const el = document.createElement("div");
    el.className = "yt-list-card";
    el.innerHTML = `
      <div class="yt-list-thumb">
        <div class="yt-list-thumb-inner">${v.icon}</div>
        <span class="yt-duration">${v.dur}</span>
      </div>
      <div class="yt-list-meta yt-meta">
        <div class="yt-title">${v.title}</div>
        <div class="yt-channel">${v.channel}</div>
        <div class="metadata-line">
          <span class="inline-metadata-item">${v.views} Aufrufe</span>
          <span class="inline-metadata-item">&nbsp;•&nbsp;</span>
          <span class="inline-metadata-item ago-item">${v.ago}</span>
        </div>
      </div>`;
    list.appendChild(el);

    const badge = document.createElement("span");
    badge.className = "xdate-badge";
    badge.dataset.vid = v.title;
    badge.textContent = formatDate(v.date, s.format, s.showTime, s.emoji);
    Object.assign(badge.style, css);
    el.querySelector(".metadata-line").appendChild(badge);

    if (s.mode === "replace")
      el.querySelector(".ago-item").style.display = "none";
  });

  // Compact (nur erste 4)
  const compact = document.getElementById("compact-cards");
  compact.innerHTML = "";
  VIDEOS.slice(0, 4).forEach(v => {
    const el = document.createElement("div");
    el.className = "yt-compact-card";
    el.innerHTML = `
      <div class="yt-compact-thumb">
        <div class="yt-compact-thumb-inner">${v.icon}</div>
        <span class="yt-duration" style="font-size:10px">${v.dur}</span>
      </div>
      <div class="yt-compact-meta yt-meta">
        <div class="yt-title">${v.title}</div>
        <div class="yt-channel">${v.channel}</div>
        <div class="metadata-line">
          <span class="inline-metadata-item">${v.views}</span>
          <span class="inline-metadata-item">&nbsp;•&nbsp;</span>
          <span class="inline-metadata-item ago-item">${v.ago}</span>
        </div>
      </div>`;
    compact.appendChild(el);

    const badge = document.createElement("span");
    badge.className = "xdate-badge";
    badge.dataset.vid = v.title;
    badge.textContent = formatDate(v.date, s.format, s.showTime, s.emoji);
    Object.assign(badge.style, css);
    el.querySelector(".metadata-line").appendChild(badge);

    if (s.mode === "replace")
      el.querySelector(".ago-item").style.display = "none";
  });
}

/* ═══════════════ Slider-Labels live updaten ═════════════════════════ */
function bindSlider(id, labelId, suffix, rebuild) {
  const el = document.getElementById(id);
  const lbl = document.getElementById(labelId);
  el.addEventListener("input", () => {
    lbl.textContent = el.value + suffix;
    rebuild ? buildCards() : updateBadges();
  });
}

bindSlider("c-bg-alpha",    "c-bg-alpha-val",    "%",   false);
bindSlider("c-border-alpha","c-border-alpha-val","%",   false);
bindSlider("c-fontsize",    "c-fontsize-val",    "",    false);
bindSlider("c-lineheight",  "c-lineheight-val",  "",    false);
bindSlider("c-px",          "c-px-val",          "px",  false);
bindSlider("c-py",          "c-py-val",          "px",  false);
bindSlider("c-radius",      "c-radius-val",      "px",  false);
bindSlider("c-ml",          "c-ml-val",          "px",  false);
bindSlider("c-gap",         "c-gap-val",         "px",  false);
bindSlider("c-bw",          "c-bw-val",          "px",  false);

/* ═══════════════ Alle Controls → updateBadges ═══════════════════════ */
["c-color","c-fontweight","c-emoji","c-format","c-time","c-mode"]
  .forEach(id => document.getElementById(id).addEventListener("change", () => {
    id === "c-format" || id === "c-emoji" || id === "c-time" || id === "c-mode"
      ? buildCards()
      : updateBadges();
  }));

/* ═══════════════ CSS kopieren ════════════════════════════════════════ */
document.getElementById("copy-btn").addEventListener("click", () => {
  const text = document.getElementById("css-output").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ Kopiert!";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "CSS kopieren";
      btn.classList.remove("copied");
    }, 1800);
  });
});

/* ═══════════════ Init ════════════════════════════════════════════════ */
buildCards();
updateCSSOutput(getSettings());
</script>
