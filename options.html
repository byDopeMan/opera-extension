<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Exact Date – Einstellungen & Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Roboto", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 18px 18px 10px;
      border-bottom: 1px solid #2a2a2a;
    }

    .section {
      padding: 14px 18px;
      border-bottom: 1px solid #222;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .row label { font-size: 13px; color: #ccc; flex: 1; white-space: nowrap; }

    .row input[type="color"] {
      width: 36px; height: 28px;
      border: 1px solid #444; border-radius: 5px;
      background: none; cursor: pointer; padding: 1px;
    }
    .row input[type="range"] {
      flex: 1; accent-color: #ff0000; cursor: pointer;
    }
    .row select {
      background: #252525; border: 1px solid #3a3a3a;
      border-radius: 5px; color: #f1f1f1; font-size: 13px;
      padding: 4px 8px; cursor: pointer; flex: 1;
    }
    .row input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #ff0000; cursor: pointer;
    }
    .val-label { font-size: 12px; color: #888; min-width: 30px; text-align: right; }

    #css-output {
      margin: 0 18px 14px;
      background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 10px 12px; font-family: "Consolas", monospace;
      font-size: 11px; color: #8bc34a; line-height: 1.6;
      white-space: pre; overflow-x: auto; cursor: pointer; user-select: all;
      display: block;
    }
    #css-output:hover { border-color: #555; }

    .action-row {
      margin: 0 18px 14px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; padding: 8px 10px;
      cursor: pointer; transition: background .15s;
    }
    .btn-save { background: #43c463; color: #000; }
    .btn-save:hover { background: #5dd67a; }
    .btn-save.saved { background: #2e7d32; color: #fff; }
    .btn-copy { background: #1e1e1e; color: #aaa; border: 1px solid #333; }
    .btn-copy:hover { background: #272727; color: #f1f1f1; }
    .btn-copy.copied { background: #1565c0; color: #fff; border-color: #1565c0; }

    /* ── Preview ──────────────────────────────────────────── */
    #preview {
      flex: 1; overflow-y: auto; padding: 28px 32px; background: #0f0f0f;
    }

    #preview h2 { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 20px; }

    .yt-section-label {
      font-size: 11px; color: #555; text-transform: uppercase;
      letter-spacing: .07em; margin: 28px 0 12px;
      padding-bottom: 6px; border-bottom: 1px solid #1e1e1e;
    }

    .yt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 8px; }

    .yt-thumb { width: 100%; aspect-ratio: 16/9; background: #272727; border-radius: 10px; margin-bottom: 10px; position: relative; overflow: hidden; }
    .yt-thumb-inner { width: 100%; height: 100%; background: linear-gradient(135deg, #1f1f1f 0%, #2d2d2d 50%, #1a1a1a 100%); display: flex; align-items: center; justify-content: center; color: #3a3a3a; font-size: 28px; }
    .yt-duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.85); color: #fff; font-size: 12px; font-weight: 600; padding: 1px 5px; border-radius: 3px; }

    .yt-card-info { display: flex; gap: 10px; }
    .yt-avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .yt-meta { flex: 1; }
    .yt-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: #f1f1f1; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .yt-channel { font-size: 12px; color: #aaa; margin-bottom: 2px; }
    .metadata-line { font-size: 12px; color: #aaa; display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }

    .yt-list { display: flex; flex-direction: column; gap: 10px; }
    .yt-list-card { display: flex; gap: 14px; }
    .yt-list-thumb { width: 200px; min-width: 200px; aspect-ratio: 16/9; background: #272727; border-radius: 8px; position: relative; overflow: hidden; }
    .yt-list-thumb-inner { width: 100%; height: 100%; background: linear-gradient(135deg, #1f1f1f, #2d2d2d, #1a1a1a); display: flex; align-items: center; justify-content: center; color: #3a3a3a; font-size: 22px; }
    .yt-list-meta .yt-title { font-size: 16px; }

    .yt-compact { display: flex; flex-direction: column; gap: 8px; }
    .yt-compact-card { display: flex; gap: 8px; }
    .yt-compact-thumb { width: 130px; min-width: 130px; aspect-ratio: 16/9; background: #272727; border-radius: 6px; position: relative; overflow: hidden; }
    .yt-compact-thumb-inner { width: 100%; height: 100%; background: linear-gradient(135deg, #1f1f1f, #2d2d2d); display: flex; align-items: center; justify-content: center; color: #3a3a3a; font-size: 16px; }
    .yt-compact-meta .yt-title { font-size: 13px; }
    .yt-compact-meta .yt-channel { font-size: 11px; }
    .yt-compact-meta .metadata-line { font-size: 11px; }

    .xdate-badge {
      display: inline-flex; align-items: center; gap: 0px;
      margin-left: 1px; padding: 0px 5px; border-radius: 8px;
      font-weight: 300; font-size: 0.85rem; line-height: 1.35;
      white-space: nowrap; color: #43c463;
      background: rgba(67,196,99,0.00);
      border: 0.5px solid rgba(67,196,99,0.35);
    }
    .xdate-badge.xdate-wait { color: #9aa0a6; background: rgba(154,160,166,.14); border-color: rgba(154,160,166,.30); font-weight: 400; }
    .xdate-badge.xdate-err { color: #e0a030; background: rgba(224,160,48,.14); border-color: rgba(224,160,48,.30); }
  </style>
</head>
<body>

<aside id="sidebar">
  <h1>Einstellungen & Design</h1>

  <div class="section">
    <div class="section-title">Farbe</div>
    <div class="row"><label>Text-Farbe</label><input type="color" id="c-color" value="#43c463"></div>
    <div class="row">
      <label>Hintergrund-Opacity</label>
      <input type="range" id="c-bg-alpha" min="0" max="40" value="0">
      <span class="val-label" id="c-bg-alpha-val">0%</span>
    </div>
    <div class="row">
      <label>Border-Opacity</label>
      <input type="range" id="c-border-alpha" min="0" max="100" value="35">
      <span class="val-label" id="c-border-alpha-val">35%</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Schrift</div>
    <div class="row">
      <label>Größe (rem)</label>
      <input type="range" id="c-fontsize" min="0.7" max="2.0" step="0.05" value="0.85">
      <span class="val-label" id="c-fontsize-val">0.85</span>
    </div>
    <div class="row">
      <label>Gewicht</label>
      <select id="c-fontweight">
        <option value="300" selected>Light</option>
        <option value="400">Normal</option>
        <option value="500">Medium</option>
        <option value="600">SemiBold</option>
        <option value="700">Bold</option>
      </select>
    </div>
    <div class="row">
      <label>Zeilenhöhe</label>
      <input type="range" id="c-lineheight" min="1.0" max="2.5" step="0.05" value="1.35">
      <span class="val-label" id="c-lineheight-val">1.35</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Abstand & Form</div>
    <div class="row">
      <label>Padding X (px)</label>
      <input type="range" id="c-px" min="0" max="20" value="5">
      <span class="val-label" id="c-px-val">5px</span>
    </div>
    <div class="row">
      <label>Padding Y (px)</label>
      <input type="range" id="c-py" min="0" max="12" value="0">
      <span class="val-label" id="c-py-val">0px</span>
    </div>
    <div class="row">
      <label>Border-Radius (px)</label>
      <input type="range" id="c-radius" min="0" max="20" value="8">
      <span class="val-label" id="c-radius-val">8px</span>
    </div>
    <div class="row">
      <label>Margin Left (px)</label>
      <input type="range" id="c-ml" min="0" max="20" value="1">
      <span class="val-label" id="c-ml-val">1px</span>
    </div>
    <div class="row">
      <label>Gap Icon↔Text (px)</label>
      <input type="range" id="c-gap" min="0" max="10" value="0">
      <span class="val-label" id="c-gap-val">0px</span>
    </div>
    <div class="row">
      <label>Border Breite (px)</label>
      <input type="range" id="c-bw" min="0" max="4" step="0.5" value="0.5">
      <span class="val-label" id="c-bw-val">0.5px</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Inhalt</div>
    <div class="row">
      <label>Emoji/Präfix</label>
      <select id="c-emoji">
        <option value="📅">📅 Kalender</option>
        <option value="🗓️">🗓️ Spiralbuch</option>
        <option value="⏰">⏰ Wecker</option>
        <option value="">(keins)</option>
      </select>
    </div>
    <div class="row">
      <label>Datum-Format</label>
      <select id="c-format">
        <option value="DD.MM.YYYY" selected>DD.MM.YYYY</option>
        <option value="D. Mon YYYY">D. Monat YYYY</option>
        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
        <option value="MM/DD/YYYY">MM/DD/YYYY</option>
      </select>
    </div>
    <div class="row">
      <label>Uhrzeit zeigen</label>
      <input type="checkbox" id="c-time">
    </div>
    <div class="row">
      <label>Modus</label>
      <select id="c-mode">
        <option value="append" selected>append (neben alt)</option>
        <option value="replace">replace (nur exakt)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">CSS Vorschau</div>
    <code id="css-output"></code>
  </div>

  <div class="action-row">
    <button class="btn btn-copy" id="copy-btn">Kopieren</button>
    <button class="btn btn-save" id="save-btn">In Extension speichern</button>
  </div>
</aside>

<main id="preview">
  <h2>Vorschau – YouTube Videokarten</h2>
  <div class="yt-section-label">Startseite / Kanal-Grid</div>
  <div class="yt-grid" id="grid-cards"></div>
  <div class="yt-section-label">Suchergebnisse</div>
  <div class="yt-list" id="list-cards"></div>
  <div class="yt-section-label">Sidebar (neben Video)</div>
  <div class="yt-compact" id="compact-cards"></div>
</main>

<script src="options.js"></script>
</body>
</html>
